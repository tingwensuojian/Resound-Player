name: Sync to Gitee

on:
  push:
    branches: [main]
  create:
    tags:
      - v*

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: |
          git remote add gitee https://${{ secrets.GITEE_TOKEN }}@gitee.com/tingwensuojian/Resound-Player.git
          git push -f gitee main
          git push -f gitee --tags
