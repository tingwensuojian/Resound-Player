name: Build Windows Installer

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: '上传到指定 Release tag（留空则只保存为 artifact）'
        required: false
        type: string
  push:
    tags:
      - "v*"

jobs:
  build-win:
    name: Build Windows Installer
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm ci

      - name: Build Windows package
        env:
          GH_TOKEN: ${{ github.token }}
        run: npm run dist:win

      - name: Inspect dist-build
        run: Get-ChildItem dist-build/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist-build
          path: dist-build/
          retention-days: 30

      - name: Upload to Release
        if: |
          startsWith(github.ref, 'refs/tags/') ||
          (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $Tag = "${env:GITHUB_REF_NAME}"
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            $Tag = "${{ inputs.release_tag }}"
          }
          $Version = $Tag -replace '^v', ''

          # Generate release notes from commits
          $PrevTag = git tag --sort=-version:refname | Select-Object -First 2 | Select-Object -Last 1
          if ($PrevTag) {
            $Commits = git log "$PrevTag..$Tag" --no-merges --oneline --reverse
            $NotesBody = @()
            $NotesBody += "## 更新内容"
            $NotesBody += ""
            forEach ($c in $Commits) {
              $msg = $c -replace '^[0-9a-f]+ ', ''
              $NotesBody += "- $msg"
            }
            $NotesText = $NotesBody -join "`n"
          } else {
            $NotesText = "## 更新内容"
          }

          gh release view $Tag *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release edit $Tag --title "Resound-Player v$Version" --notes $NotesText
          } else {
            gh release create $Tag --target $env:GITHUB_SHA --title "Resound-Player v$Version" --notes $NotesText
          }

          Write-Host "Uploading Windows EXE to release $Tag..."
          gh release upload $Tag dist-build/*.exe dist-build/*.blockmap dist-build/latest.yml --clobber
