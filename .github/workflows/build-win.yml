name: Build Windows Installer

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: '上传到指定 Release tag（留空则只保存为 artifact）'
        required: false
        type: string
  push:
    tags:
      - "v*"

jobs:
  build-win:
    name: Build Windows Installer
    permissions:
      contents: write
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm ci

      - name: Build Windows package
        env:
          GH_TOKEN: ${{ github.token }}
        run: npm run dist:win

      - name: Inspect dist-build
        run: Get-ChildItem dist-build/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist-build
          path: dist-build/
          retention-days: 30

      - name: Upload to Release
        if: |
          startsWith(github.ref, 'refs/tags/') ||
          (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $Tag = "${env:GITHUB_REF_NAME}"
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            $Tag = "${{ inputs.release_tag }}"
          }
          $Version = $Tag -replace '^v', ''

          # Generate release notes from commits
          $PrevTag = git tag --sort=-version:refname | Select-Object -First 2 | Select-Object -Last 1
          $NotesFile = [System.IO.Path]::GetTempFileName()
          "# Resound-Player v$Version`n`n## 更新内容`n" | Out-File -FilePath $NotesFile -Encoding UTF8BOM
          if ($PrevTag) {
            git log "$PrevTag..$Tag" --no-merges --oneline --reverse | ForEach-Object {
              $_ -replace '^[0-9a-f]+ ', '- '
            } | Out-File -FilePath $NotesFile -Encoding UTF8BOM -Append
          }
          "`n---`n`n## 安装说明`n`n### macOS`n1. 下载对应架构的 .dmg 文件（Apple Silicon 选 arm64，Intel 选 x64）`n2. 打开后拖入 Applications 文件夹`n3. 首次打开若提示无法验证开发者，需前往 系统设置 > 隐私与安全性 > 仍要打开`n`n### Windows`n1. 下载 Resound-Player-Setup-v$Version.exe`n2. 双击运行安装`n`n### Docker`n```````ndocker run -d -p 80:80 tingwensuojian/resound-player-server:${Version}`n```````n`n## 校验说明`n`nSHA256 校验值见 Release 附件中的 .blockmap 文件。" | Out-File -FilePath $NotesFile -Encoding UTF8BOM -Append

          gh release view $Tag *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release edit $Tag --title "Resound-Player v$Version" --notes-file $NotesFile
          } else {
            gh release create $Tag --target $env:GITHUB_SHA --title "Resound-Player v$Version" --notes-file $NotesFile
          }
          Remove-Item $NotesFile -Force

          Write-Host "Uploading Windows EXE to release $Tag..."
          gh release upload $Tag dist-build/*.exe dist-build/*.blockmap dist-build/latest.yml --clobber
