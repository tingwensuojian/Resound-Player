name: Build Windows Installer

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: '上传到指定 Release tag（留空则只保存为 artifact）'
        required: false
        type: string
  push:
    tags:
      - "v*"

jobs:
  build-win:
    name: Build Windows Installer
    permissions:
      contents: write
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm ci

      - name: Build Windows package
        env:
          GH_TOKEN: ${{ github.token }}
        run: npm run dist:win

      - name: Save NSIS installer before portable build
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path .\dist-save | Out-Null
          Copy-Item dist-build\*Setup*.* .\dist-save\
          Copy-Item dist-build\*.blockmap .\dist-save\
          Copy-Item dist-build\latest.yml .\dist-save\

      - name: Build portable package
        shell: pwsh
        run: npm run dist:win:portable

      - name: Restore NSIS installer
        shell: pwsh
        run: Copy-Item .\dist-save\* dist-build\

      - name: Inspect dist-build
        run: Get-ChildItem dist-build/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist-build
          path: dist-build/
          retention-days: 30

      - name: Upload to Release
        if: |
          startsWith(github.ref, 'refs/tags/') ||
          (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"
          [ "${{ github.event_name }}" = "workflow_dispatch" ] && TAG="${{ inputs.release_tag }}"
          VERSION="${TAG#v}"

          # Build release notes
          cat > /tmp/release-notes.md << 'EOF'
          # Resound-Player v${VERSION}

          ## ????
          EOF
          PREV_TAG=$(git tag --sort=-version:refname | head -2 | tail -1)
          if [ -n "$PREV_TAG" ]; then
            git log "$PREV_TAG..$TAG" --no-merges --oneline --reverse | sed 's/^[0-9a-f]* */- /' >> /tmp/release-notes.md
          fi
          (
            echo ""
            echo "---"
            echo ""
            echo "## ????"
            echo ""
            echo "### macOS"
            echo "| ?? | ???? | ?? |"
            echo "|---|----|---|"
            echo "| Resound-Player-Mac-x64-${VERSION}.dmg | **Intel ??** | DMG ?????? Applications ?? |"
            echo "| Resound-Player-Mac-arm64-${VERSION}.dmg | **Apple ??** | DMG ?????? Applications ?? |"
            echo ""
            cat deploy/release-macos-tips.md 2>/dev/null || true
            echo ""
            echo "### Windows"
            echo "| ?? | ???? | ?? |"
            echo "|---|----|---|"
            echo "| Resound-Player Setup ${VERSION}.exe | **????????** | NSIS ????????????????????? |"
            echo "| Resound-Player-${VERSION}.exe | **U????????** | ??????????? |"
            echo ""
            echo "### Docker"
            echo '```'
            echo "docker run -d -p 38760:80 tingwensuojian/resound-player-server:${VERSION}"
            echo '```'
            echo ""
            echo "## ????"
            echo ""
            echo "SHA256 ???? Release ???? .blockmap ???"
          ) >> /tmp/release-notes.md

          # Create/update GitHub Release (same pattern as Mac build)
          gh release view "${TAG}" >/dev/null 2>&1 ||             gh release create "${TAG}" --target "${GITHUB_SHA}" --title "Resound-Player ${TAG}"
          gh release edit "${TAG}" --notes-file /tmp/release-notes.md 2>/dev/null || true

          echo "Uploading Windows EXE to release ${TAG}..."
          gh release upload "${TAG}" dist-build/*.exe dist-build/*.blockmap dist-build/latest.yml --clobber      - name: Sync to Gitee Release (via release2gitee)
        if: |
          startsWith(github.ref, 'refs/tags/') ||
          (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $R2G_VERSION = "v1.2.1"
          $R2G_URL = "https://github.com/hepengju/release2gitee/releases/download/${R2G_VERSION}/release2gitee-x86_64-pc-windows-msvc.zip"
          Write-Host "Downloading release2gitee ${R2G_VERSION}..."
          curl.exe -sL "$R2G_URL" -o release2gitee.zip
          Expand-Archive -Path "release2gitee.zip" -DestinationPath "." -Force
          Remove-Item release2gitee.zip -Force
          Write-Host "Syncing releases to Gitee..."
          $env:GITHUB_OWNER = "tingwensuojian"
          $env:GITHUB_REPO = "Resound-Player"
          $env:GITEE_OWNER = "tingwensuojian"
          $env:GITEE_REPO = "Resound-Player"
          $env:release2gitee__github_latest_release_count = "5"
          $env:release2gitee__gitee_retain_release_attach_files_count = "3"
          $env:release2gitee__release_body_url_replace = "false"
          $env:release2gitee__latest_json_url_replace = "false"
          $env:release2gitee__gitee_branch = "master"
          .\release2gitee.exe
