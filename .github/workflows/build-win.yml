name: Build Windows App

on:
  workflow_dispatch:

jobs:
  build-win:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: npm install
      - run: npm run dist:win
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: Resound-Player-Win-Setup
          path: dist-build/*.exe
          if-no-files-found: warn
          retention-days: 14
