name: Build Windows Installer

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: '上传到指定 Release tag（留空则只保存为 artifact）'
        required: false
        type: string
  push:
    tags:
      - "v*"

jobs:
  build-win:
    name: Build Windows Installer
    permissions:
      contents: write
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm ci

      - name: Build Windows package
        env:
          GH_TOKEN: ${{ github.token }}
        run: npm run dist:win

      - name: Save NSIS installer before portable build
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path .\dist-save | Out-Null
          Copy-Item dist-build\*Setup*.* .\dist-save\
          Copy-Item dist-build\*.blockmap .\dist-save\
          Copy-Item dist-build\latest.yml .\dist-save\

      - name: Build portable package
        shell: pwsh
        run: npm run dist:win:portable

      - name: Restore NSIS installer
        shell: pwsh
        run: Copy-Item .\dist-save\* dist-build\

      - name: Inspect dist-build
        run: Get-ChildItem dist-build/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist-build
          path: dist-build/
          retention-days: 30

      - name: Upload to Release
        if: |
          startsWith(github.ref, 'refs/tags/') ||
          (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.release_tag }}"
          fi
          gh release view "${TAG}" >/dev/null 2>&1 || \
            gh release create "${TAG}" \
              --target "${GITHUB_SHA}" \
              --title "Resound-Player ${TAG}"
          echo "Uploading Windows installer to release ${TAG}..."
          gh release upload "${TAG}" dist-build/*.exe dist-build/*.blockmap dist-build/latest.yml --clobber
      - name: Sync to Gitee Release (via release2gitee)
        if: |
          startsWith(github.ref, 'refs/tags/') ||
          (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $R2G_VERSION = "v1.2.1"
          $R2G_URL = "https://github.com/hepengju/release2gitee/releases/download/${R2G_VERSION}/release2gitee-x86_64-pc-windows-msvc.zip"
          Write-Host "Downloading release2gitee ${R2G_VERSION}..."
          curl.exe -sL "$R2G_URL" -o release2gitee.zip
          Expand-Archive -Path "release2gitee.zip" -DestinationPath "." -Force
          Remove-Item release2gitee.zip -Force
          Write-Host "Syncing releases to Gitee..."
          $env:GITHUB_OWNER = "tingwensuojian"
          $env:GITHUB_REPO = "Resound-Player"
          $env:GITEE_OWNER = "tingwensuojian"
          $env:GITEE_REPO = "Resound-Player"
          $env:release2gitee__github_latest_release_count = "5"
          $env:release2gitee__gitee_retain_release_attach_files_count = "1"
          $env:release2gitee__release_body_url_replace = "false"
          $env:release2gitee__latest_json_url_replace = "false"
          .\release2gitee.exe

      - name: Upload missing assets to Gitee (retry with longer timeout)
        if: |
          startsWith(github.ref, 'refs/tags/') ||
          (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
        shell: pwsh
        run: |
          # Determine the tag
          $TAG = "${{ github.ref_name }}"
          if ("${{ github.event_name }}" -eq "workflow_dispatch" -and "${{ inputs.release_tag }}" -ne "") {
            $TAG = "${{ inputs.release_tag }}"
          }
          Write-Host "Looking up Gitee release for tag: $TAG"
          
          # Find Gitee release ID
          $authHeaders = @{ "Authorization" = "token $env:GITEE_TOKEN"; "Accept" = "application/json" }
          $releasesUrl = "https://gitee.com/api/v5/repos/tingwensuojian/Resound-Player/releases?per_page=20"
          $releases = Invoke-RestMethod -Uri $releasesUrl -Headers $authHeaders -Method Get
          $giteeRelease = $releases | Where-Object { $_.tag_name -eq $TAG } | Select-Object -First 1
          if (-not $giteeRelease) {
            Write-Host "Gitee release $TAG not found, skipping"
            exit 0
          }
          $releaseId = $giteeRelease.id
          Write-Host "Gitee release ID: $releaseId"
          
          # Already uploaded asset names
          $uploadedNames = $giteeRelease.assets | ForEach-Object { $_.name }
          Write-Host "Already uploaded: $($uploadedNames -join ', ')"
          
          # Build file list from dist-build
          $filesToUpload = @()
          $patterns = @("*Setup*.exe", "*.exe", "*.blockmap", "latest.yml")
          foreach ($pattern in $patterns) {
            Get-ChildItem "dist-build/$pattern" -ErrorAction SilentlyContinue | ForEach-Object {
              $filesToUpload += @{ Path = $_.FullName; Name = $_.Name }
            }
          }
          
          foreach ($file in $filesToUpload) {
            if ($uploadedNames -contains $file.Name) {
              Write-Host "Already uploaded, skip: $($file.Name)"
              continue
            }
            $uploadUrl = "https://gitee.com/api/v5/repos/tingwensuojian/Resound-Player/releases/$releaseId/attach_files"
            Write-Host "Uploading $($file.Name)..."
            curl.exe -s --connect-timeout 30 --max-time 600 -X POST "$uploadUrl" `
              -H "Authorization: token $env:GITEE_TOKEN" `
              -F "file=@$($file.Path)" `
              -w "`nHTTP_CODE:%{http_code}"
            if ($LASTEXITCODE -eq 0) {
              Write-Host "Uploaded: $($file.Name)"
            } else {
              Write-Host "Upload returned non-zero exit: $LASTEXITCODE for $($file.Name)"
            }
          }
