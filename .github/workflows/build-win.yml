name: Build Windows Installer

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: '涓婁紶鍒版寚瀹?Release tag锛堢暀绌哄垯鍙繚瀛樹负 artifact锛?
        required: false
        type: string
  push:
    tags:
      - "v*"

jobs:
  build-win:
    name: Build Windows Installer
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm ci

      - name: Build Windows package
        env:
          GH_TOKEN: ${{ github.token }}
        run: npm run dist:win

      - name: Inspect dist-build
        run: Get-ChildItem dist-build/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist-build
          path: dist-build/
          retention-days: 30

      - name: Upload to Release
        if: |
          startsWith(github.ref, 'refs/tags/') ||
          (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $Tag = "${{ env.GITHUB_REF_NAME }}"
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            $Tag = "${{ inputs.release_tag }}"
          }
          $Version = $Tag -replace '^v', ''

          # Generate release notes from commits
          $PrevTag = git tag --sort=-version:refname | Select-Object -First 2 | Select-Object -Last 1
          $NotesFile = [System.IO.Path]::GetTempFileName()
          "# Resound-Player v$Version`n`n## 鏇存柊鍐呭`n" | Out-File -FilePath $NotesFile -Encoding UTF8
          if ($PrevTag) {
            git log "$PrevTag..$Tag" --no-merges --oneline --reverse | ForEach-Object {
              $_ -replace '^[0-9a-f]+ ', '- '
            } | Out-File -FilePath $NotesFile -Encoding UTF8 -Append
          }
          "`n---`n`n## 瀹夎璇存槑`n`n### macOS`n1. 涓嬭浇瀵瑰簲鏋舵瀯鐨?.dmg 鏂囦欢锛圓pple Silicon 閫?arm64锛孖ntel 閫?x64锛塦n2. 鎵撳紑鍚庢嫋鍏?Applications 鏂囦欢澶筦n3. 棣栨鎵撳紑鑻ユ彁绀烘棤娉曢獙璇佸紑鍙戣€咃紝闇€鍓嶅線 绯荤粺璁剧疆 > 闅愮涓庡畨鍏ㄦ€?> 浠嶈鎵撳紑`n`n### Windows`n1. 涓嬭浇 Resound-Player-Setup-v$Version.exe`n2. 鍙屽嚮杩愯瀹夎`n`n### Docker`n```````ndocker run -d -p 80:80 tingwensuojian/resound-player-server:${Version}`n```````n`n## 鏍￠獙璇存槑`n`nSHA256 鏍￠獙鍊艰 Release 闄勪欢涓殑 .blockmap 鏂囦欢銆? | Out-File -FilePath $NotesFile -Encoding UTF8 -Append

          gh release view $Tag *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release edit $Tag --title "Resound-Player v$Version" --notes-file $NotesFile
          } else {
            gh release create $Tag --target $env:GITHUB_SHA --title "Resound-Player v$Version" --notes-file $NotesFile
          }
          Remove-Item $NotesFile -Force

          Write-Host "Uploading Windows EXE to release $Tag..."
          gh release upload $Tag dist-build/*.exe dist-build/*.blockmap dist-build/latest.yml --clobber
