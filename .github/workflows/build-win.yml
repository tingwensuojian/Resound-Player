name: Build Windows App

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: '上传到指定 Release tag（留空则只保存为 artifact）'
        required: false
        type: string
  push:
    tags:
      - "v*"

jobs:
  build-win:
    name: Build Windows Installer
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        shell: pwsh
        run: npm ci

      - name: Build NSIS installer
        shell: pwsh
        run: npm run dist:win

      - name: Save NSIS installer before portable build
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path .\dist-save | Out-Null
          Copy-Item dist-build\*Setup*.* .\dist-save\
          Copy-Item dist-build\*.blockmap .\dist-save\
          Copy-Item dist-build\latest.yml .\dist-save\

      - name: Build portable package
        shell: pwsh
        run: npm run dist:win:portable

      - name: Restore NSIS installer
        shell: pwsh
        run: |
          Copy-Item .\dist-save\* dist-build\

      - name: Inspect build output
        if: always()
        shell: pwsh
        run: |
          Write-Host "dist-build contents:"
          Get-ChildItem dist-build -Force | Format-Table -AutoSize
          Write-Host "exe files:"
          Get-ChildItem dist-build -Filter *.exe -Recurse -ErrorAction SilentlyContinue | Select-Object FullName

      - name: Upload EXE artifact (workflow)
        uses: actions/upload-artifact@v7
        with:
          name: Resound-Player-Windows-exe
          path: |
            dist-build/*.exe
            dist-build/*.blockmap
            dist-build/latest.yml
          if-no-files-found: error
          retention-days: 14

      - name: Upload to Release
        if: |
          startsWith(github.ref, 'refs/tags/') ||
          (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $Tag = "${env:GITHUB_REF_NAME}"
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            $Tag = "${{ inputs.release_tag }}"
          }
          $Version = $Tag -replace '^v', ''

          # Build release notes with all platform info
          $NotesFile = New-TemporaryFile
          @"
          ## v$Version 更新内容

          ### 新功能
          - 启动加载画面：应用启动时展示带声波动画的 splash 窗口，主窗口 ready-to-show 后自动关闭
          - Windows 任务栏小组件增强：C++ HoverDetector、封面全屏按钮、FM 模式不感兴趣按钮、Lucide Heart 图标、长歌词滚动
          - 桌面播控统一开关：合并任务栏小组件和系统托盘的歌词控制开关
          - 迷你模式收藏按钮同步修复

          ### 修复
          - 迷你模式窗口：修复 Windows 下黑屏闪烁、宽度不一致、resize 闪动
          - Windows 图标：修复便携版和安装版的任务栏图标，重构 prepare-win-icon.mjs
          - 构建流程：重写 build-win.mjs（三步：dir → rcedit → --prepackaged），修复 CI 构建
          - 音量控件改为悬浮上拉面板
          - 稳定性：EPIPE 防护、Vite 自动重启、did-fail-load 重试

          ---

          ## 下载说明

          ### Windows

          | 文件 | 适用场景 | 说明 |
          |------|---------|------|
          | `Resound-Player Setup $Version.exe` | **日常使用（推荐）** | NSIS 安装包，安装后启动即时，任务栏图标正确显示 |
          | `Resound-Player-$Version.exe` | **U 盘携带、临时使用** | 便携版，免安装直接运行，首次启动需 3-5 秒解压 |

          ### macOS

          | 文件 | 适用场景 | 说明 |
          |------|---------|------|
          | `Resound-Player-Mac-x64-$Version.dmg` | **Intel 芯片** | DMG 安装包，拖入 Applications 即可 |
          | `Resound-Player-Mac-arm64-$Version.dmg` | **Apple 芯片** | DMG 安装包，拖入 Applications 即可 |
          "@ | Set-Content -Path $NotesFile -Encoding utf8

          gh release view $Tag *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release edit $Tag --title "Resound-Player 版本 $Version" --notes-file $NotesFile
          } else {
            gh release create $Tag --target $env:GITHUB_SHA --title "Resound-Player 版本 $Version" --notes-file $NotesFile
          }

          Write-Host "Uploading Windows EXE to release $Tag..."
          gh release upload $Tag dist-build/*.exe dist-build/*.blockmap dist-build/latest.yml --clobber
