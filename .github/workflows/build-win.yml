name: Build Windows App

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: '上传到指定 Release tag（留空则只保存为 artifact）'
        required: false
        type: string
  push:
    tags:
      - "v*"

jobs:
  build-win:
    name: Build Windows Installer
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        shell: pwsh
        run: npm ci

      - name: Build native taskbar widget addon
        shell: pwsh
        run: |
          cd native/taskbar-widget-helper
          npm ci --ignore-scripts
          npx --yes node-gyp@latest rebuild --target=42.1.0 --arch=x64 --dist-url=https://electronjs.org/headers --msvs_version=2022

      - name: Build NSIS installer
        shell: pwsh
        run: npm run dist:win

      - name: Save NSIS installer before portable build
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path .\dist-save | Out-Null
          Copy-Item dist-build\*Setup*.* .\dist-save\
          Copy-Item dist-build\*.blockmap .\dist-save\
          Copy-Item dist-build\latest.yml .\dist-save\

      - name: Build portable package
        shell: pwsh
        run: npm run dist:win:portable

      - name: Restore NSIS installer
        shell: pwsh
        run: |
          Copy-Item .\dist-save\* dist-build\

      - name: Inspect build output
        if: always()
        shell: pwsh
        run: |
          Write-Host "dist-build contents:"
          Get-ChildItem dist-build -Force | Format-Table -AutoSize
          Write-Host "exe files:"
          Get-ChildItem dist-build -Filter *.exe -Recurse -ErrorAction SilentlyContinue | Select-Object FullName

      - name: Upload EXE artifact (workflow)
        uses: actions/upload-artifact@v7
        with:
          name: Resound-Player-Windows-exe
          path: |
            dist-build/*.exe
            dist-build/*.blockmap
            dist-build/latest.yml
          if-no-files-found: error
          retention-days: 14

      - name: Upload to Release
        if: |
          startsWith(github.ref, 'refs/tags/') ||
          (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $Tag = "${env:GITHUB_REF_NAME}"
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            $Tag = "${{ inputs.release_tag }}"
          }
          $Version = $Tag -replace '^v', ''

          gh release view $Tag *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release edit $Tag --title "Resound-Player v$Version"
          } else {
            gh release create $Tag --target $env:GITHUB_SHA --title "Resound-Player v$Version" --notes "???????????????.."
          }

          Write-Host "Uploading Windows EXE to release $Tag..."
          gh release upload $Tag dist-build/*.exe dist-build/*.blockmap dist-build/latest.yml --clobber
