name: Build Windows App

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: '上传到指定 Release tag（留空则只保存为 artifact）'
        required: false
        type: string
  push:
    branches:
      - main
    tags:
      - "v*"

jobs:
  build-win:
    name: Build Windows Installer
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        shell: pwsh
        run: npm ci

      - name: Build Windows package
        shell: pwsh
        run: npm run dist:win

      - name: Inspect build output
        if: always()
        shell: pwsh
        run: |
          Write-Host "dist-build contents:"
          Get-ChildItem dist-build -Force | Format-Table -AutoSize
          Write-Host "exe files:"
          Get-ChildItem dist-build -Filter *.exe -Recurse -ErrorAction SilentlyContinue | Select-Object FullName

      - name: Upload EXE artifact (workflow)
        uses: actions/upload-artifact@v7
        with:
          name: Resound-Player-Windows-exe
          path: |
            dist-build/*.exe
            dist-build/*.blockmap
          if-no-files-found: error
          retention-days: 14

      - name: Upload to Release
        if: |
          startsWith(github.ref, 'refs/tags/') ||
          (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $Tag = "${env:GITHUB_REF_NAME}"
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            $Tag = "${{ inputs.release_tag }}"
          }
          $Version = $Tag -replace '^v', ''
          $NotesFile = New-TemporaryFile
          @"
          ## 更新内容

          - 修复桌面端后端服务在打包环境中的模块解析问题。
          - 修复 Windows 任务栏图标与应用身份绑定问题。
          - 优化 Windows 小尺寸图标生成清晰度与安装器图标资源。

          ## 安装说明

          - 下载 Windows 安装包后直接运行安装。
          - 如果任务栏或桌面仍显示旧图标，请卸载旧版本后重新安装。
          "@ | Set-Content -Path $NotesFile -Encoding utf8

          gh release view $Tag *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release edit $Tag --title "Resound-Player 版本 $Version" --notes-file $NotesFile
          } else {
            gh release create $Tag --target $env:GITHUB_SHA --title "Resound-Player 版本 $Version" --notes-file $NotesFile
          }

          Write-Host "Uploading EXE to release $Tag..."
          gh release upload $Tag dist-build/*.exe dist-build/*.blockmap --clobber
