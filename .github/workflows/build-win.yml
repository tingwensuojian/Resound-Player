name: Build Windows Installer

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: '上传到指定 Release tag（留空则只保存为 artifact）'
        required: false
        type: string
  push:
    tags:
      - "v*"

jobs:
  build-win:
    name: Build Windows Installer
    permissions:
      contents: write
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm ci

      - name: Build Windows package
        env:
          GH_TOKEN: ${{ github.token }}
        run: npm run dist:win

      - name: Save NSIS installer before portable build
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path .\dist-save | Out-Null
          Copy-Item dist-build\*Setup*.* .\dist-save\
          Copy-Item dist-build\*.blockmap .\dist-save\
          Copy-Item dist-build\latest.yml .\dist-save\

      - name: Build portable package
        shell: pwsh
        run: npm run dist:win:portable

      - name: Restore NSIS installer
        shell: pwsh
        run: Copy-Item .\dist-save\* dist-build\

      - name: Inspect dist-build
        run: Get-ChildItem dist-build/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist-build
          path: dist-build/
          retention-days: 30

      - name: Upload to Release
        if: |
          startsWith(github.ref, 'refs/tags/') ||
          (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $Tag = "${env:GITHUB_REF_NAME}"
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            $Tag = "${{ inputs.release_tag }}"
          }
          $Version = $Tag -replace '^v', ''

          # Build notes text in memory (avoids file encoding issues on Windows)
          $NL = New-Object System.Collections.ArrayList
          $null = $NL.Add("# Resound-Player v$Version")
          $null = $NL.Add("")
          $null = $NL.Add("## " + [char]0x66F4 + "" + [char]0x65B0 + "" + [char]0x5185 + "" + [char]0x5BB9 + "")
          $PrevTag = git tag --sort=-version:refname | Select-Object -First 2 | Select-Object -Last 1
          if ($PrevTag) {
            git log "$PrevTag..$Tag" --no-merges --oneline --reverse | ForEach-Object {
              $_ -replace '^[0-9a-f]+ ', '- '
            } | ForEach-Object { $null = $NL.Add($_) }
          }
          $null = $NL.Add("")
          $null = $NL.Add("---")
          $null = $NL.Add("")
          $null = $NL.Add("## " + [char]0x4E0B + "" + [char]0x8F7D + "" + [char]0x8BF4 + "" + [char]0x660E + "")
          $null = $NL.Add("")
          $null = $NL.Add("### macOS")
          $null = $NL.Add("")
          $null = $NL.Add("| " + [char]0x6587 + [char]0x4EF6 + " | " + [char]0x9002 + [char]0x7528 + [char]0x573A + [char]0x666F + " | " + [char]0x8BF4 + [char]0x660E + " |")
          $null = $NL.Add("|---|----|---|")
          $null = $NL.Add("| Resound-Player-Mac-x64-" + $Version + ".dmg | **Intel " + [char]0x82AF + [char]0x7247 + "** | DMG " + [char]0x5B89 + [char]0x88C5 + [char]0x5305 + [char]0xFF0C + [char]0x62D6 + [char]0x5165 + " Applications " + [char]0x5373 + [char]0x53EF + " |")
          $null = $NL.Add("| Resound-Player-Mac-arm64-" + $Version + ".dmg | **Apple " + [char]0x82AF + [char]0x7247 + "** | DMG " + [char]0x5B89 + [char]0x88C5 + [char]0x5305 + [char]0xFF0C + [char]0x62D6 + [char]0x5165 + " Applications " + [char]0x5373 + [char]0x53EF + " |")
          $null = $NL.Add("")
          # Read macOS tips from file
          $MacTipsLines = Get-Content "deploy/release-macos-tips.md" -Encoding UTF8
          foreach ($l in $MacTipsLines) { $null = $NL.Add($l) }
          $null = $NL.Add("")
          $null = $NL.Add("### Windows")
          $null = $NL.Add("| " + [char]0x6587 + [char]0x4EF6 + " | " + [char]0x9002 + [char]0x7528 + [char]0x573A + [char]0x666F + " | " + [char]0x8BF4 + [char]0x660E + " |")
          $null = $NL.Add("|---|----|---|")
          $null = $NL.Add("| Resound-Player Setup " + $Version + ".exe | **" + [char]0x65E5 + [char]0x5E38 + [char]0x4F7F + [char]0x7528 + [char]0xFF08 + [char]0x63A8 + [char]0x8350 + [char]0xFF09 + "** | NSIS " + [char]0x5B89 + [char]0x88C5 + [char]0x5305 + [char]0xFF0C + [char]0x5B89 + [char]0x88C5 + [char]0x540E + [char]0x542F + [char]0x52A8 + [char]0x5373 + [char]0x65F6 + [char]0xFF0C + [char]0x4EFB + [char]0x52A1 + [char]0x680F + [char]0x56FE + [char]0x6807 + [char]0x6B63 + [char]0x786E + [char]0x663E + [char]0x793A + " |")
          $null = $NL.Add("| Resound-Player-" + $Version + ".exe | **U " + [char]0x76D8 + [char]0x643A + [char]0x5E26 + [char]0x3001 + [char]0x4E34 + [char]0x65F6 + [char]0x4F7F + [char]0x7528 + "** | " + [char]0x4FBF + [char]0x643A + [char]0x7248 + [char]0xFF0C + [char]0x514D + [char]0x5B89 + [char]0x88C5 + [char]0x76F4 + [char]0x63A5 + [char]0x8FD0 + [char]0x884C + " |")
          $null = $NL.Add("")
          $null = $NL.Add("### Docker")
          $null = $NL.Add('```')
          $null = $NL.Add("docker run -d -p 38760:80 tingwensuojian/resound-player-server:${Version}")
          $null = $NL.Add('```')
          $null = $NL.Add("")
          $null = $NL.Add("## " + [char]0x6821 + "" + [char]0x9A8C + "" + [char]0x8BF4 + "" + [char]0x660E + "")
          $null = $NL.Add("")
          $null = $NL.Add("SHA256 " + [char]0x6821 + "" + [char]0x9A8C + "" + [char]0x503C + "" + [char]0x89C1 + " Release " + [char]0x9644 + "" + [char]0x4EF6 + "" + [char]0x4E2D + "" + [char]0x7684 + " .blockmap " + [char]0x6587 + "" + [char]0x4EF6 + "" + [char]0x3002 + "")
          $NotesBody = $NL -join "`n"

          # Build JSON payload with .NET
          $Payload = @{ body = $NotesBody } | ConvertTo-Json -Depth 10
          $JsonFile = [System.IO.Path]::GetTempFileName() + '.json'
          [System.IO.File]::WriteAllText($JsonFile, $Payload, [System.Text.UTF8Encoding]::new($false))

          # Create or update release via curl API (sends raw bytes, no encoding conversion)
          $RelInfo = gh api "/repos/{owner}/{repo}/releases/tags/$Tag" --jq '.id' 2>$null
          if ($RelInfo) {
            curl.exe -s -X PATCH "https://api.github.com/repos/tingwensuojian/Resound-Player/releases/$RelInfo" `
              -H "Authorization: token $env:GH_TOKEN" `
              -H "Content-Type: application/json" `
              -d "@$JsonFile" | Out-Null
          } else {
            $PayloadFull = @{
              tag_name = $Tag
              target_commitish = $env:GITHUB_SHA
              name = "Resound-Player v$Version"
              body = $NotesBody
            } | ConvertTo-Json -Depth 10
            [System.IO.File]::WriteAllText($JsonFile, $PayloadFull, [System.Text.UTF8Encoding]::new($false))
            curl.exe -s -X POST "https://api.github.com/repos/tingwensuojian/Resound-Player/releases" `
              -H "Authorization: token $env:GH_TOKEN" `
              -H "Content-Type: application/json" `
              -d "@$JsonFile" | Out-Null
          }
          Remove-Item $JsonFile -Force

          Write-Host "Uploading Windows EXE to release $Tag..."
          gh release upload $Tag dist-build/*.exe dist-build/*.blockmap dist-build/latest.yml --clobber
