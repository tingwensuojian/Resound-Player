name: Build macOS App

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: '上传到指定 Release tag（留空则只保存为 artifact）'
        required: false
        type: string
  push:
    tags:
      - "v*"

jobs:
  build-mac:
    name: Build macOS DMG (${{ matrix.arch }})
    strategy:
      matrix:
        arch: [x64, arm64]
    runs-on: macos-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build macOS package (${{ matrix.arch }})
        run: npm run dist:mac:${{ matrix.arch }}

      - name: Inspect build output
        if: always()
        run: |
          echo "dist-build contents:"
          ls -la dist-build || true

      - name: Upload DMG artifact (workflow)
        uses: actions/upload-artifact@v7
        with:
          name: Resound-Player-macOS-${{ matrix.arch }}-dmg
          path: |
          dist-build/*.dmg
          dist-build/latest-mac.yml
          if-no-files-found: error
          retention-days: 14

      - name: Upload to Release
        if: |
          startsWith(github.ref, 'refs/tags/') ||
          (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.release_tag }}"
          fi

          # Don't create or edit release notes — that's done by the Windows workflow.
          # If release doesn't exist yet, create it silently so upload can proceed.
          gh release view "${TAG}" >/dev/null 2>&1 || \
            gh release create "${TAG}" \
              --target "${GITHUB_SHA}" \
              --title "Resound-Player ${TAG}" \
              --notes "构建中，请稍后查看完整发布说明..." \
              >/dev/null 2>&1 || true

          echo "Uploading DMG (${{ matrix.arch }}) to release ${TAG}..."
          gh release upload "${TAG}" dist-build/*.dmg dist-build/*.dmg.blockmap dist-build/latest-mac.yml --clobber
