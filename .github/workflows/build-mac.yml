name: Build macOS App

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Upload to specific Release tag (leave empty for artifact only)"
        required: false
        type: string
  push:
    tags:
      - "v*"

jobs:
  build-mac:
    name: Build macOS DMG (${{ matrix.arch }})
    strategy:
      matrix:
        arch: [x64, arm64]
    runs-on: macos-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci

      - name: Build macOS package (${{ matrix.arch }})
        run: npm run dist:mac:${{ matrix.arch }}

      - name: Inspect dist-build
        if: always()
        run: ls -la dist-build || true

      - name: Upload artifact (workflow)
        uses: actions/upload-artifact@v7
        with:
          name: macos-${{ matrix.arch }}
          path: |
            dist-build/*.dmg
            dist-build/*.zip
            dist-build/latest-mac.yml
          retention-days: 1

      - name: Upload DMG to Release
        if: |
          startsWith(github.ref, 'refs/tags/') ||
          (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.release_tag }}"
          fi
          gh release view "${TAG}" >/dev/null 2>&1 || \
            gh release create "${TAG}" \
              --target "${GITHUB_SHA}" \
              --title "Resound-Player ${TAG}"
          echo "Uploading DMG (${{ matrix.arch }}) to release ${TAG}..."
          gh release upload "${TAG}" dist-build/*.dmg dist-build/*.dmg.blockmap dist-build/*.zip dist-build/*.zip.blockmap dist-build/latest-mac.yml --clobber

  merge-latest:
    name: Merge latest-mac.yml for both arches
    needs: build-mac
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: macos-x64
          path: x64
      - uses: actions/download-artifact@v4
        with:
          name: macos-arm64
          path: arm64

      - name: Build merged latest-mac.yml
        shell: bash
        run: |
          set -e
          X64_YML=$(ls x64/latest-mac.yml)
          ARM64_YML=$(ls arm64/latest-mac.yml)
          X64_DMG=$(ls x64/*.dmg | head -1)
          ARM64_DMG=$(ls arm64/*.dmg | head -1)
          VERSION=$(grep "^version:" "$X64_YML" | awk "{print \$2}")
          X64_NAME=$(basename "$X64_DMG")
          ARM64_NAME=$(basename "$ARM64_DMG")
          X64_SHA=$(grep "sha512:" "$X64_YML" | head -1 | awk "{print \$2}")
          ARM64_SHA=$(grep "sha512:" "$ARM64_YML" | head -1 | awk "{print \$2}")
          X64_SIZE=$(stat -c%s "$X64_DMG")
          ARM64_SIZE=$(stat -c%s "$ARM64_DMG")
          RDATE=$(grep "releaseDate:" "$X64_YML" | sed 's/releaseDate: *//; s/^"//; s/"$//')

          # ZIP files (if they exist)
          X64_ZIP=$(ls x64/*.zip 2>/dev/null | head -1 || true)
          ARM64_ZIP=$(ls arm64/*.zip 2>/dev/null | head -1 || true)

          # Build latest-mac.yml using printf to avoid YAML heredoc indentation issues
          printf 'version: %s\nfiles:\n  - url: %s\n    sha512: %s\n    size: %s\n  - url: %s\n    sha512: %s\n    size: %s\n' \
            "$VERSION" "$X64_NAME" "$X64_SHA" "$X64_SIZE" "$ARM64_NAME" "$ARM64_SHA" "$ARM64_SIZE" > latest-mac.yml

          if [ -n "$X64_ZIP" ] && [ -n "$ARM64_ZIP" ]; then
            X64_ZIP_NAME=$(basename "$X64_ZIP")
            ARM64_ZIP_NAME=$(basename "$ARM64_ZIP")
            X64_ZIP_SIZE=$(stat -c%s "$X64_ZIP")
            ARM64_ZIP_SIZE=$(stat -c%s "$ARM64_ZIP")
            X64_ZIP_SHA=$(openssl dgst -sha512 -binary "$X64_ZIP" | base64 -w 0)
            ARM64_ZIP_SHA=$(openssl dgst -sha512 -binary "$ARM64_ZIP" | base64 -w 0)
            printf '  - url: %s\n    sha512: %s\n    size: %s\n  - url: %s\n    sha512: %s\n    size: %s\n' \
              "$X64_ZIP_NAME" "$X64_ZIP_SHA" "$X64_ZIP_SIZE" "$ARM64_ZIP_NAME" "$ARM64_ZIP_SHA" "$ARM64_ZIP_SIZE" >> latest-mac.yml
          fi

          printf 'path: %s\nsha512: %s\nreleaseDate: "%s"\n' "$X64_NAME" "$X64_SHA" "$RDATE" >> latest-mac.yml

          echo "=== merged latest-mac.yml (saved as latest-mac.yml) ==="
          cat latest-mac.yml
      - name: Upload merged latest-mac.yml to Release
        if: |
          startsWith(github.ref, 'refs/tags/') ||
          (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"
          [ "${{ github.event_name }}" = "workflow_dispatch" ] && TAG="${{ inputs.release_tag }}"
          gh release view "${TAG}" >/dev/null 2>&1 || \
            gh release create "${TAG}" \
              --target "${GITHUB_SHA}" \
              --title "Resound-Player ${TAG}"
          gh release view "${TAG}" --json assets -q ".assets[] | select(.name==\"latest-mac.yml\") | .id" 2>/dev/null | while read id; do
            gh api -X DELETE "repos/tingwensuojian/Resound-Player/releases/assets/$id" 2>/dev/null || true
          done
          echo "Uploading merged latest-mac.yml as latest-mac.yml..."
          gh release upload "${TAG}" latest-mac.yml --clobber

      - name: Upload to Gitee Release
        if: |
          startsWith(github.ref, 'refs/tags/') ||
          (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"
          [ "${{ github.event_name }}" = "workflow_dispatch" ] && TAG="${{ inputs.release_tag }}"

          echo "Uploading to Gitee Release ${TAG}..."

          AUTH="Authorization: Bearer ${GITEE_TOKEN}"
          API="https://gitee.com/api/v5/repos/tingwensuojian/Resound-Player"

          # Check if release exists, create if not
          REL_ID=$(curl -s "$API/releases/tags/${TAG}" -H "$AUTH" -H "Accept: application/json" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('id',''))" 2>/dev/null || echo "")

          if [ -z "$REL_ID" ]; then
            echo "Creating Gitee release..."
            REL_ID=$(curl -s -X POST "$API/releases"               -H "$AUTH"               -H "Accept: application/json"               -H "Content-Type: application/json"               -d "$(printf '{"tag_name":"%s","name":"v%s"}' "${TAG}" "${TAG#v}")" | python3 -c "import sys,json; print(json.load(sys.stdin).get('id',''))")
          fi

          if [ -z "$REL_ID" ]; then
            echo "Failed to get Gitee release ID"
            exit 0
          fi

          echo "Gitee release ID: ${REL_ID}"

          # Upload DMG files and YAML
          for f in x64/*.dmg arm64/*.dmg latest-mac.yml; do
            if [ -f "$f" ]; then
              echo "  Uploading $f..."
              curl -s -X POST "$API/releases/${REL_ID}/attach_files"                 -H "$AUTH"                 -H "Accept: application/json"                 -F "file=@${f}" > /dev/null
            fi
          done
          echo "Gitee upload complete"


