name: Build macOS App

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Upload to specific Release tag (leave empty for artifact only)"
        required: false
        type: string
  push:
    tags:
      - "v*"

jobs:
  build-mac:
    name: Build macOS DMG (${{ matrix.arch }})
    strategy:
      matrix:
        arch: [x64, arm64]
    runs-on: macos-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci

      - name: Build macOS package (${{ matrix.arch }})
        run: npm run dist:mac:${{ matrix.arch }}

      - name: Inspect dist-build
        if: always()
        run: ls -la dist-build || true

      - name: Upload artifact (workflow)
        uses: actions/upload-artifact@v7
        with:
          name: macos-${{ matrix.arch }}
          path: |
            dist-build/*.dmg
            dist-build/*.zip
            dist-build/latest-mac.yml
          retention-days: 1

      - name: Upload DMG to Release
        if: |
          startsWith(github.ref, 'refs/tags/') ||
          (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.release_tag }}"
          fi
          gh release view "${TAG}" >/dev/null 2>&1 || \
            gh release create "${TAG}" \
              --target "${GITHUB_SHA}" \
              --title "Resound-Player ${TAG}" \
              --notes "构建中，请稍后查看完整发布说明..."
          echo "Uploading DMG (${{ matrix.arch }}) to release ${TAG}..."
          gh release upload "${TAG}" dist-build/*.dmg dist-build/*.dmg.blockmap dist-build/*.zip dist-build/*.zip.blockmap dist-build/latest-mac.yml --clobber

  merge-latest:
    name: Merge latest-mac.yml for both arches
    needs: build-mac
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: macos-x64
          path: x64
      - uses: actions/download-artifact@v4
        with:
          name: macos-arm64
          path: arm64

      - name: Build merged latest-mac.yml
        shell: bash
        run: |
          set -e
          X64_YML=$(ls x64/latest-mac.yml)
          ARM64_YML=$(ls arm64/latest-mac.yml)
          X64_DMG=$(ls x64/*.dmg | head -1)
          ARM64_DMG=$(ls arm64/*.dmg | head -1)
          VERSION=$(grep "^version:" "$X64_YML" | awk "{print \$2}")
          X64_NAME=$(basename "$X64_DMG")
          ARM64_NAME=$(basename "$ARM64_DMG")
          X64_SHA=$(grep "sha512:" "$X64_YML" | head -1 | awk "{print \$2}")
          ARM64_SHA=$(grep "sha512:" "$ARM64_YML" | head -1 | awk "{print \$2}")
          X64_SIZE=$(stat -c%s "$X64_DMG")
          ARM64_SIZE=$(stat -c%s "$ARM64_DMG")
          RDATE=$(grep "releaseDate:" "$X64_YML" | sed 's/releaseDate: *//; s/^"//; s/"$//')

          # ZIP files (if they exist)
          X64_ZIP=$(ls x64/*.zip 2>/dev/null | head -1 || true)
          ARM64_ZIP=$(ls arm64/*.zip 2>/dev/null | head -1 || true)

          cat > latest-mac.yml <<- DATA
          version: $VERSION
          files:
            - url: $X64_NAME
              sha512: $X64_SHA
              size: $X64_SIZE
            - url: $ARM64_NAME
              sha512: $ARM64_SHA
              size: $ARM64_SIZE
DATA

          if [ -n "$X64_ZIP" ] && [ -n "$ARM64_ZIP" ]; then
            X64_ZIP_NAME=$(basename "$X64_ZIP")
            ARM64_ZIP_NAME=$(basename "$ARM64_ZIP")
            X64_ZIP_SIZE=$(stat -c%s "$X64_ZIP")
            ARM64_ZIP_SIZE=$(stat -c%s "$ARM64_ZIP")
            X64_ZIP_SHA=$(openssl dgst -sha512 -binary "$X64_ZIP" | base64)
            ARM64_ZIP_SHA=$(openssl dgst -sha512 -binary "$ARM64_ZIP" | base64)

            cat >> latest-mac.yml <<- DATA
            - url: $X64_ZIP_NAME
              sha512: $X64_ZIP_SHA
              size: $X64_ZIP_SIZE
            - url: $ARM64_ZIP_NAME
              sha512: $ARM64_ZIP_SHA
              size: $ARM64_ZIP_SIZE
DATA
          fi

          cat >> latest-mac.yml <<- DATA
          path: $X64_NAME
          sha512: $X64_SHA
          releaseDate: "$RDATE"
          DATA

          echo "=== merged latest-mac.yml (saved as latest-mac.yml) ==="
          cat latest-mac.yml

      - name: Upload merged latest-mac.yml to Release
        if: |
          startsWith(github.ref, 'refs/tags/') ||
          (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"
          [ "${{ github.event_name }}" = "workflow_dispatch" ] && TAG="${{ inputs.release_tag }}"
          gh release view "${TAG}" >/dev/null 2>&1 || \
            gh release create "${TAG}" \
              --target "${GITHUB_SHA}" \
              --title "Resound-Player ${TAG}" \
              --notes "构建中，请稍后查看完整发布说明..."
          gh release view "${TAG}" --json assets -q ".assets[] | select(.name==\"latest-mac.yml\") | .id" 2>/dev/null | while read id; do
            gh api -X DELETE "repos/tingwensuojian/Resound-Player/releases/assets/$id" 2>/dev/null || true
          done
          echo "Uploading merged latest-mac.yml as latest-mac.yml..."
          gh release upload "${TAG}" latest-mac.yml --clobber