name: Build macOS App

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: '上传到指定 Release tag（留空则只保存为 artifact）'
        required: false
        type: string
  push:
    branches:
      - main
    tags:
      - "v*"

jobs:
  build-mac:
    name: Build macOS DMG
    runs-on: macos-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build macOS package
        run: npm run dist:mac

      - name: Inspect build output
        if: always()
        run: |
          echo "dist-build contents:"
          ls -la dist-build || true
          echo "dmg files:"
          find dist-build -maxdepth 2 -name "*.dmg" -print || true

      - name: Upload DMG artifact (workflow)
        uses: actions/upload-artifact@v7
        with:
          name: Resound-Player-macOS-dmg
          path: dist-build/*.dmg
          if-no-files-found: error
          retention-days: 14

      - name: Upload to Release
        if: |
          startsWith(github.ref, 'refs/tags/') ||
          (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.release_tag }}"
          fi
          VERSION="${TAG#v}"
          NOTES_FILE="$(mktemp)"
          cat > "${NOTES_FILE}" <<EOF
          ## 更新内容

          - 修复桌面端音源替换的内置匹配桥返回值问题。
          - 避免音源匹配结果因进程通信数据不可克隆而回退失败。
          - 保持 macOS 应用图标整体缩放效果。

          ## 安装说明

          - 下载适用于苹果芯片的 macOS 安装包。
          - 如果安装后仍看到旧图标，请先移除旧应用，再重新安装。
          EOF
          if gh release view "${TAG}" >/dev/null 2>&1; then
            gh release edit "${TAG}" \
              --title "Resound-Player 版本 ${VERSION}" \
              --notes-file "${NOTES_FILE}"
          else
            gh release create "${TAG}" \
              --target "${GITHUB_SHA}" \
              --title "Resound-Player 版本 ${VERSION}" \
              --notes-file "${NOTES_FILE}"
          fi
          echo "Uploading DMG to release ${TAG}..."
          gh release upload "${TAG}" dist-build/*.dmg dist-build/*.dmg.blockmap --clobber
